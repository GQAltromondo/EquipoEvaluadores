_schema-version: "3.2"
ID: equipoevaluador
version: 0.0.1
modules:
- name: equipoevaluador-destination-content
  type: com.sap.application.content
  requires:
  - name: equipoevaluador-destination-service
    parameters:
      content-target: true
  - name: equipoevaluador_html_repo_host
    parameters:
      service-key:
        name: equipoevaluador_html_repo_host-key
  - name: uaa_equipoevaluador
    parameters:
      service-key:
        name: uaa_equipoevaluador-key
  parameters:
    content:
      instance:
        destinations:
        - Name: equipoevaluador_equipoevaluador_html_repo_host
          ServiceInstanceName: equipoevaluador-html5-app-host-service
          ServiceKeyName: equipoevaluador_html_repo_host-key
          sap.cloud.service: equipoevaluador
        - Authentication: OAuth2UserTokenExchange
          Name: equipoevaluador_uaa_equipoevaluador
          ServiceInstanceName: equipoevaluador-xsuaa-service
          ServiceKeyName: uaa_equipoevaluador-key
          sap.cloud.service: equipoevaluador
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: equipoevaluador-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: equipoevaluador_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - transenerequipoevaluador.zip
      name: transenerequipoevaluador
      target-path: resources/
- name: transenerequipoevaluador
  type: html5
  path: equipoevaluador
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: equipoevaluador-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: equipoevaluador-destination-service
    service-plan: lite
- name: equipoevaluador_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: equipoevaluador-html5-app-host-service
    service-plan: app-host
- name: uaa_equipoevaluador
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: equipoevaluador-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
